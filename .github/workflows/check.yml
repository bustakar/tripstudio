name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      github.event_name == 'push' ||
      github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      github.event.action == 'synchronize' ||
      (github.event.action == 'labeled' && github.event.label.name == 'preview:web')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  authorize-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:web') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:web')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require maintainer permission
        if: github.event.action == 'labeled'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            })
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'preview:web',
              })
              core.setFailed('Only maintainers can request a web preview.')
            }

  deploy-preview:
    if: >-
      needs.check.result == 'success' &&
      needs.authorize-preview.result == 'success'
    needs: [check, authorize-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate preview configuration
        run: |
          : "${NEON_API_KEY:?Missing preview secret NEON_API_KEY}"
          : "${NEON_PROJECT_ID:?Missing repository variable NEON_PROJECT_ID}"
          : "${VERCEL_TOKEN:?Missing preview secret VERCEL_TOKEN}"
          : "${VERCEL_ORG_ID:?Missing repository variable VERCEL_ORG_ID}"
          : "${VERCEL_PROJECT_ID:?Missing repository variable VERCEL_PROJECT_ID}"
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      - name: Create Neon preview branch
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
          database: tripstudio
          role: tripstudio_owner
      - name: Mask Neon connection string
        run: echo "::add-mask::$DATABASE_URL"
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
      - name: Deploy Preview
        id: deploy
        run: |
          deployment_url=$(pnpm exec vercel deploy --archive=tgz --target=preview \
            --build-env DATABASE_URL="$DATABASE_URL" \
            --build-env TRIPSTUDIO_PR_PREVIEW=1 \
            --env DATABASE_URL="$DATABASE_URL" \
            --env TRIPSTUDIO_PR_PREVIEW=1 \
            --token="$VERCEL_TOKEN")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      - name: Publish preview URL
        run: |
          echo "Web preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}

  cleanup-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'unlabeled' && github.event.label.name == 'preview:web') ||
      (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview:web')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    steps:
      - name: Delete Neon preview branch
        run: |
          branch_id=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" \
            | jq --raw-output --arg name "$BRANCH_NAME" \
              '.branches[] | select(.name == $name) | .id')
          if [[ -n "$branch_id" ]]; then
            curl --fail --silent --show-error --request DELETE \
              --header "Authorization: Bearer $NEON_API_KEY" \
              "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$branch_id" \
              >/dev/null
          fi
        env:
          BRANCH_NAME: preview/pr-${{ github.event.pull_request.number }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

  deploy-development:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate deployment configuration
        run: |
          : "${VERCEL_TOKEN:?Missing development secret VERCEL_TOKEN}"
          : "${VERCEL_ORG_ID:?Missing repository variable VERCEL_ORG_ID}"
          : "${VERCEL_PROJECT_ID:?Missing repository variable VERCEL_PROJECT_ID}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      - name: Deploy Development
        id: deploy
        run: |
          deployment_url=$(pnpm exec vercel deploy --archive=tgz --target=preview --token="$VERCEL_TOKEN")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      - name: Promote Development Alias
        run: |
          deployment_host=${DEPLOYMENT_URL#https://}
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"alias":"dev.tripstudio.cc"}' \
            "https://api.vercel.com/v2/deployments/$deployment_host/aliases?teamId=$VERCEL_ORG_ID" \
            >/dev/null
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
