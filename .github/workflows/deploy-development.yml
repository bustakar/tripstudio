name: Deploy Development

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    env:
      DEPLOY_CONFIGURED: ${{ secrets.DATABASE_URL != '' && secrets.BETTER_AUTH_SECRET != '' && secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.12.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:migrate
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          APP_URL: https://dev.tripstudio.cc
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      - name: Deploy Development
        if: env.DEPLOY_CONFIGURED == 'true'
        id: deploy
        run: |
          deployment_url=$(pnpm exec vercel deploy --archive=tgz --target=preview --token="$VERCEL_TOKEN")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Promote Development Alias
        if: env.DEPLOY_CONFIGURED == 'true'
        run: pnpm exec vercel alias set "${{ steps.deploy.outputs.url }}" dev.tripstudio.cc --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
