name: Deploy Production

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_CONFIGURED: ${{ secrets.DATABASE_URL != '' && secrets.BETTER_AUTH_SECRET != '' && secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:migrate
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          APP_URL: https://tripstudio.cc
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      - name: Deploy Production
        if: env.DEPLOY_CONFIGURED == 'true'
        id: deploy
        run: |
          deployment_url=$(pnpm dlx vercel@latest deploy --archive=tgz --prod --skip-domain --token="$VERCEL_TOKEN")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Promote Production Alias
        if: env.DEPLOY_CONFIGURED == 'true'
        run: pnpm dlx vercel@latest alias set "${{ steps.deploy.outputs.url }}" tripstudio.cc --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
